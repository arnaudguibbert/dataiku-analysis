name: dummy-workflow
on: push
jobs: 
    dummy-job: 
        runs-on: ubuntu-latest
        steps:
        # Action available in github marketplace
        # This allow to connect to the current git repo
        - name: checkout action
          uses: actions/checkout@v4.2.2

        - name: read file
          run: cat README.md

        # Multiple line command
        - name: dummy message
          run: |
            echo Hello > test.txt
            ls -lt

        - name: upload artifact
          uses: actions/upload-artifact@v4
          with: 
            name: test-artifact
            path: ./test.txt

    artifact-job:
        needs: dummy-job
        runs-on: ubuntu-latest
        steps:
          - name: download-artifact
            uses: actions/download-artifact@v4
            with:
              name: test-artifact

    